[project]
name = "ai-matchmaker"
version = "0.1.0"
description = "AI Matchmaker API"
authors = [
    { name = "Egor Kuznetsov", email = "ek2kkk@yandex.ru" }
]
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.16",
    "argon2-cffi>=25.1.0",
    "boto3>=1.35",
    "fastapi>=0.116",
    "pillow>=11.0",
    "geoalchemy2>=0.20.0",
    "httpx>=0.28",
    "jsonschema>=4.25",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.10",
    "sqlalchemy>=2.0",
    "structlog>=25.4",
    "uvicorn[standard]>=0.35",
]

[project.scripts]
ai-matchmaker = "ai_dating:main"
ai-matchmaker-relay = "ai_dating.relay:main"
ai-matchmaker-replay = "ai_dating.replay:main"
ai-matchmaker-ch-init = "ai_dating.ch_init:main"
ai-matchmaker-worker = "ai_dating.worker:main"
ai-matchmaker-rerank-eval = "ai_dating.ai.eval:main"
ai-matchmaker-invite = "ai_dating.auth.invites:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "ai_dating"

[dependency-groups]
dev = [
    "httpx>=0.28",
    "pytest>=8.4",
    "ruff>=0.12",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "postgres: needs DATABASE_DIRECT_URL",
    "integration: needs local ClickHouse",
]

[tool.ruff]
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
